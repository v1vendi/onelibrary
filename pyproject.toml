[project]
name = "onelibrary"
version = "0.0.1"
description = "Read and write the AlphaTheta/Pioneer DJ OneLibrary (exportLibrary.db) format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rekordbox", "onelibrary", "dj", "cdj", "pioneer", "alphatheta"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "sqlcipher3-wheels>=0.5.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
anlz = ["pyrekordbox>=0.4"]

[project.scripts]
onelibrary = "onelibrary.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onelibrary"]

[tool.ruff]
line-length = 100
